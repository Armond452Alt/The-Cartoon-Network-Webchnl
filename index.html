<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cartoon Network Webchannel</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0c0c0c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .player-container {
      width: 100%;
      max-width: 960px;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    video {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
    }
    .status-bar {
      padding: 12px 16px;
      background: #18181b;
      font-size: 14px;
      color: #a1a1aa;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
      margin-right: 6px;
    }
    .status-indicator.live {
      background-color: #22c55e;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <video id="video" controls playsinline poster=""></video>
    <div class="status-bar">
      <span>Cartoon Network Webchannel</span>
      <div>
        <span id="indicator" class="status-indicator"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const indicator = document.getElementById('indicator');
    const statusText = document.getElementById('status-text');

    // Your Render live HLS stream endpoint
    const streamUrl = 'https://the-cartoon-network-webchnl.onrender.com/public/hls/index.m3u8';

    function setLiveStatus(isLive) {
      if (isLive) {
        indicator.classList.add('live');
        statusText.textContent = 'LIVE';
      } else {
        indicator.classList.remove('live');
        statusText.textContent = 'Offline / Connecting';
      }
    }

    if (Hls.isSupported()) {
      const hls = new Hls({
        liveSyncDurationCount: 3,
        enableWorker: true,
      });

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setLiveStatus(true);
        video.play().catch(() => {
          // Autoplay blocked by browser policy (requires user interaction)
          console.log('Autoplay prevented. User interaction required.');
        });
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          setLiveStatus(false);
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              console.error('Network error encountered, attempting recovery...');
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              console.error('Media error encountered, attempting recovery...');
              hls.recoverMediaError();
              break;
            default:
              hls.destroy();
              break;
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Native support for Safari & iOS devices
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => {
        setLiveStatus(true);
        video.play();
      });
    } else {
      statusText.textContent = 'HLS Not Supported in this browser';
    }
  </script>

</body>
</html>
